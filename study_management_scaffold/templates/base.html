<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="csrf-token" content="{{ csrf_token() }}">
  <title>{% block title %}Study Management System{% endblock %}</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 680px; margin: 3rem auto; padding: 0 1rem; }
    label { display: block; margin-top: 1rem; }
    input { box-sizing: border-box; width: 100%; padding: .6rem; margin-top: .3rem; }
    button { margin-top: 1rem; padding: .6rem 1rem; cursor: pointer; }
    .message { padding: .7rem; background: #f1f1f1; margin: .5rem 0; }
    .task { border: 1px solid #ddd; padding: 1rem; margin: 1rem 0; border-radius: .4rem; }
    .missing-deadline { color: #8a5a00; font-weight: 700; }
    .filters { display: flex; gap: 1rem; flex-wrap: wrap; }
    .filters .active { font-weight: 700; text-decoration: none; }
    .completed-label { color: #18794e; font-weight: 700; }
    nav { display: flex; gap: 1rem; align-items: center; }
    nav form { margin-left: auto; }
  </style>
</head>
<body>
  <nav><a href="{{ url_for('home') }}">Study Management System</a></nav>
  {% with messages = get_flashed_messages(with_categories=true) %}
    {% for category, message in messages %}
      <p class="message" role="status">{{ message }}</p>
    {% endfor %}
  {% endwith %}
  <main>{% block content %}{% endblock %}</main>
  <script src="{{ url_for('static', filename='reminders.js') }}" defer></script>
</body>
</html>
